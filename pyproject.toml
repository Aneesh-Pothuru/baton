[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "baton"
version = "0.1.0"
description = "A durable, memory-gated runtime for coordinated agent routines"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Aneesh Pothuru"}]
dependencies = []

[project.scripts]
baton = "baton.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

